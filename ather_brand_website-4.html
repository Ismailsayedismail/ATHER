<title>ATHER | Leave Your Mark</title>
<style>
:root{--wine:#26090b;--wine2:#3a1013;--gold:#d8c4a0;--cream:#f3eadc;--muted:#c5b4a7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 28%,#451619 0%,var(--wine) 58%,#170506 100%);color:var(--cream);font-family:Arial,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:18px;border:1px solid #d8c4a022;pointer-events:none}
main{width:min(100%,480px);text-align:center;position:relative;z-index:1;padding:26px 0 34px}
.logo{display:block;width:min(100%,330px);aspect-ratio:1;object-fit:cover;margin:0 auto 4px;mix-blend-mode:screen;filter:contrast(1.04);border-radius:2px}
.eyebrow{font-size:11px;letter-spacing:.42em;color:var(--gold);direction:ltr;margin:4px 0 16px}
h1{font-size:clamp(29px,7vw,43px);font-weight:400;letter-spacing:.35em;direction:ltr;margin:0 0 8px;padding-left:.35em}
.tagline{direction:ltr;color:var(--muted);font-size:11px;letter-spacing:.32em;margin:0 0 29px}
.rule{height:1px;width:48px;background:var(--gold);margin:0 auto 28px}
.intro{font-size:14px;color:#e3d7c9;line-height:1.9;margin:0 0 24px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:var(--cream);border:1px solid #d8c4a080;background:linear-gradient(115deg,#ffffff08,#d8c4a00b);padding:16px 18px;min-height:58px;transition:transform .2s,border-color .2s,background .2s;letter-spacing:.12em;direction:ltr}
.link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--gold);background:#d8c4a018;outline:none}
.link svg{width:19px;height:19px;stroke:var(--gold);fill:none;stroke-width:1.6}
footer{margin-top:35px;color:#bba99b;font-size:10px;letter-spacing:.22em;direction:ltr}.designer{margin:15px 0 0;color:var(--gold);font-size:10px;letter-spacing:.2em;direction:ltr;opacity:.95;text-transform:uppercase}.designer:before{content:"";display:block;width:30px;height:1px;background:#d8c4a0;opacity:.65;margin:0 auto 12px}
@media(max-height:740px){.logo{width:min(62vw,240px)}main{padding-top:8px}.tagline{margin-bottom:18px}.rule{margin-bottom:18px}}
</style></head>
